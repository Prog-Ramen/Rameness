<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mineclone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <div id="info"></div>
    <div id="blockInfo"></div>
  </div>
  <div id="overlay">
    <div id="title">Mineclone</div>
    <div id="instructions">
      <p><b>WASD</b> — Move &nbsp; <b>SPACE</b> — Jump &nbsp; <b>SHIFT</b> — Sprint</p>
      <p><b>Left Click</b> — Break block &nbsp; <b>Right Click</b> — Place block</p>
      <p><b>1–9</b> or <b>Scroll</b> — Select hotbar slot</p>
      <p><b>ESC</b> — Release cursor</p>
    </div>
    <div id="startBtn">Click to play</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
