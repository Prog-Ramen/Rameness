<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mineclone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',monospace}
canvas{display:block}
#crosshair{position:fixed;top:50%;left:50%;width:24px;height:24px;transform:translate(-50%,-50%);pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.85)}
#crosshair::before{top:11px;left:5px;width:2px;height:14px}
#crosshair::after{top:5px;left:11px;width:14px;height:2px}
#hotbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:10}
.slot{width:48px;height:48px;border:2px solid #555;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.slot.active{border-color:#fff;background:rgba(255,255,255,0.15)}
.slot canvas{width:32px;height:32px;image-rendering:pixelated}
.slot .num{position:absolute;top:2px;left:4px;color:#aaa;font-size:10px}
#info{position:fixed;top:8px;left:8px;color:#fff;font-size:12px;background:rgba(0,0,0,0.4);padding:6px 10px;border-radius:4px;z-index:10;line-height:1.5}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff}
#overlay h1{font-size:28px}
#overlay p{font-size:14px;color:#ccc}
#overlay button{padding:10px 24px;font-size:16px;cursor:pointer;background:#4a7;color:#fff;border:none;border-radius:4px}
#overlay button:hover{background:#5b8}
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hotbar"></div>
<div id="info"></div>
<div id="overlay"><h1>Mineclone</h1><p>WASD move &middot; SPACE jump &middot; Mouse look &middot; L-click break &middot; R-click place &middot; 1-9 hotbar</p><button id="playBtn">Click to Play</button></div>
<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
