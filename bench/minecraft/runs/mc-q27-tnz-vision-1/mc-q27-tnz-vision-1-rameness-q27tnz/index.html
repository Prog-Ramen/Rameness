<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockcraft — a Minecraft clone</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Verdana, sans-serif; }
  #block-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #crosshair {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 22px; text-shadow: 0 0 2px #000; pointer-events: none; z-index: 5;
  }
  #hotbar {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 5; pointer-events: none;
  }
  .slot {
    width: 44px; height: 44px; border: 2px solid #000; border-radius: 4px;
    background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center;
  }
  .slot.selected { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,.8); }
  .slot .swatch { width: 26px; height: 26px; border: 1px solid rgba(0,0,0,.5); border-radius: 2px; }
  #hud {
    position: fixed; left: 8px; bottom: 8px; color: #fff; font-size: 11px; line-height: 1.5;
    text-shadow: 1px 1px 0 #000; z-index: 5; pointer-events: none;
  }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
    text-align: center; cursor: pointer;
  }
  #overlay h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: 2px; }
  #overlay .sub { font-size: 14px; color: #bbb; max-width: 520px; line-height: 1.8; }
  #overlay .click { margin-top: 18px; font-size: 15px; color: #ffef9f; }
</style>
</head>
<body>
  <canvas id="block-canvas"></canvas>
  <div id="crosshair">+</div>
  <div id="hotbar"></div>
  <div id="hud">Blockcraft
    <span id="pos"></span>
  </div>
  <div id="overlay">
    <h1>BLOCKCRAFT</h1>
    <div class="sub">
      A tiny Minecraft clone that runs entirely in your browser.<br>
      <b>Click to play</b> &nbsp;·&nbsp; <b>Esc</b> to pause<br>
      <b>W A S D</b> move &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; <b>Mouse</b> look around<br>
      <b>Left click</b> break block &nbsp;·&nbsp; <b>Right click</b> place block<br>
      <b>1&ndash;9</b> or <b>mouse wheel</b> pick a block
    </div>
    <div class="click">Click anywhere to start</div>
  </div>
  <script src="three.min.js"></script>
  <script src="world.js"></script>
  <script src="player.js"></script>
  <script src="main.js"></script>
</body>
</html>
