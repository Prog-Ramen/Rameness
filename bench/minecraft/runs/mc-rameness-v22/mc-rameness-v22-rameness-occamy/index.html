<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine Clone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }

    #crosshair {
      position: fixed; top: 50%; left: 50%;
      width: 24px; height: 24px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
      font-family: monospace; font-size: 24px; color: #fff;
      text-shadow: 0 0 3px #000;
      user-select: none;
    }

    #hotbar {
      position: fixed; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 3px; z-index: 10;
      user-select: none;
    }
    .hotbar-slot {
      width: 52px; height: 52px;
      border: 2px solid #333;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      color: #ccc; font-family: monospace; font-size: 10px;
      cursor: pointer;
    }
    .hotbar-slot .icon { width: 32px; height: 32px; border-radius: 3px; }
    .hotbar-slot .label { margin-top: 2px; font-size: 9px; }
    .hotbar-slot.active { border-color: #fff; background: rgba(255,255,255,0.15); }

    #info {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      color: #fff; font-family: monospace; font-size: 12px;
      text-shadow: 1px 1px 2px #000;
      pointer-events: none; line-height: 1.5;
    }

    #blocker {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #blocker .box {
      background: #222; border: 2px solid #555; border-radius: 8px;
      padding: 24px 32px; color: #fff; font-family: monospace;
      text-align: center; line-height: 1.6;
    }
    #blocker .box kbd {
      background: #444; border: 1px solid #777; border-radius: 3px;
      padding: 2px 6px; font-family: monospace; font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="crosshair">+</div>
  <div id="hotbar"></div>
  <div id="info"></div>
  <div id="blocker">
    <div class="box">
      <div><b>Mine Clone</b></div>
      <div>Click to play</div>
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> sprint</div>
      <div><kbd>LMB</kbd> break &nbsp; <kbd>RMB</kbd> place &nbsp; <kbd>1</kbd>-<kbd>9</kbd> hotbar</div>
    </div>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
