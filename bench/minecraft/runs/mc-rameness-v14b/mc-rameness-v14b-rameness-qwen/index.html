<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Clone — Vanilla JS + WebGL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
    mix-blend-mode: difference;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #fff;
  }
  #crosshair::before { left: 10px; top: 2px; width: 2px; height: 18px; }
  #crosshair::after  { left: 2px; top: 10px; width: 18px; height: 2px; }

  #debug {
    position: fixed; left: 8px; top: 8px; z-index: 5;
    color: #e8e8e8; font-size: 12px; line-height: 1.5;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
    pointer-events: none;
  }

  #hotbar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 5; pointer-events: none;
  }
  .slot {
    position: relative; width: 52px; height: 52px;
    background: rgba(0,0,0,0.45);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .slot.sel { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.7); }
  .slot img { image-rendering: pixelated; }
  .slot .num {
    position: absolute; left: 3px; top: 1px; color: #ddd; font-size: 10px;
    text-shadow: 1px 1px 0 #000;
  }
  .slot .bname {
    position: absolute; bottom: 1px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 8px; text-shadow: 1px 1px 0 #000;
  }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55);
  }
  .panel {
    background: rgba(20, 22, 28, 0.92);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    padding: 28px 36px;
    color: #e8e8e8;
    max-width: 560px;
    text-align: center;
  }
  .panel h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 10px; color: #fff; }
  .panel .sub { color: #9fd48a; font-size: 13px; margin-bottom: 18px; }
  .panel table { margin: 0 auto 18px; border-collapse: collapse; font-size: 13px; }
  .panel td { padding: 3px 14px; text-align: left; color: #cfcfcf; }
  .panel td:first-child { color: #fff; font-weight: bold; text-align: right; }
  .panel .start {
    display: inline-block; margin-top: 8px; padding: 10px 26px;
    background: #3e7d2c; border: 2px solid #6fbf4f; border-radius: 4px;
    color: #fff; font-size: 16px; cursor: pointer;
  }
  .panel .start:hover { background: #4a9435; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="debug"></div>
  <div id="hotbar"></div>
  <div id="overlay" class="show">
    <div class="panel">
      <h1>MINECRAFT CLONE</h1>
      <div class="sub">vanilla JS + WebGL &middot; no build step &middot; no dependencies</div>
      <table>
        <tr><td>W A S D</td><td>move</td></tr>
        <tr><td>Mouse</td><td>look</td></tr>
        <tr><td>Left click</td><td>break block</td></tr>
        <tr><td>Right click</td><td>place block</td></tr>
        <tr><td>Space</td><td>jump / swim up / fly up</td></tr>
        <tr><td>Shift</td><td>sprint / descend while flying</td></tr>
        <tr><td>1&ndash;9 / wheel</td><td>select block</td></tr>
        <tr><td>F</td><td>toggle creative flight</td></tr>
        <tr><td>R</td><td>respawn</td></tr>
        <tr><td>Esc</td><td>release mouse</td></tr>
      </table>
      <button class="start" id="start-btn">Click to play</button>
    </div>
  </div>
  <script src="js/noise.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/raycast.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
