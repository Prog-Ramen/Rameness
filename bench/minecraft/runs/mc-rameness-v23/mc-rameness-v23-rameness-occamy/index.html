<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Clone</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="crosshair"></div>
  <div id="blockbar-label"></div>
  <div id="hotbar">
    <div class="slot active" data-slot="0"><span class="name">Grass</span></div>
    <div class="slot" data-slot="1"><span class="name">Dirt</span></div>
    <div class="slot" data-slot="2"><span class="name">Stone</span></div>
    <div class="slot" data-slot="3"><span class="name">Log</span></div>
    <div class="slot" data-slot="4"><span class="name">Leaves</span></div>
    <div class="slot" data-slot="5"><span class="name">Sand</span></div>
    <div class="slot" data-slot="6"><span class="name">Water</span></div>
    <div class="slot" data-slot="7"><span class="name">Snow</span></div>
    <div class="slot" data-slot="8"><span class="name">Brick</span></div>
  </div>
  <div id="instructions">
    <strong>MC Clone</strong><br>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp; <kbd>Space</kbd> Jump<br>
    <kbd>Mouse</kbd> Look &nbsp; <kbd>LMB</kbd> Break &nbsp; <kbd>RMB</kbd> Place<br>
    <kbd>Scroll</kbd> Select block &nbsp; <kbd>Click</kbd> Focus
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
