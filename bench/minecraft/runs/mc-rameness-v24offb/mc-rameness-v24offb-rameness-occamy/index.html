<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 24px;
            left: 50%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            width: 24px;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }

        #hotbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px;
            border-radius: 4px;
        }

        .hotbar-slot {
            width: 48px;
            height: 48px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .hotbar-slot.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        .hotbar-slot .block-icon {
            width: 32px;
            height: 32px;
            border-radius: 2px;
        }

        .hotbar-slot .slot-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
        }

        .hotbar-slot .slot-name {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 4px;
            line-height: 1.6;
        }

        #blockInfo {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #2c5f2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        #loading h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0 #1a3a1a;
        }

        #loading .subtitle {
            font-size: 14px;
            color: #a0d0a0;
            margin-bottom: 30px;
        }

        #loading .controls {
            font-size: 12px;
            color: #80b080;
            line-height: 2;
            text-align: center;
        }

        #loading .controls kbd {
            background: rgba(255,255,255,0.15);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .hidden {
            display: none !important;
        }

        #pauseMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        #pauseMenu h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        #pauseMenu .menu-option {
            padding: 10px 30px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            width: 200px;
            text-align: center;
        }

        #pauseMenu .menu-option:hover {
            background: rgba(255,255,255,0.2);
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>⛏ Minecraft</h1>
        <div class="subtitle">A browser-based voxel world</div>
        <div class="controls">
            <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> to move<br>
            <kbd>SPACE</kbd> to jump &nbsp; <kbd>SHIFT</kbd> to sneak<br>
            <kbd>Left Click</kbd> break block &nbsp; <kbd>Right Click</kbd> place block<br>
            <kbd>1</kbd>-<kbd>9</kbd> select hotbar slot &nbsp; <kbd>ESC</kbd> pause
        </div>
    </div>

    <div id="pauseMenu">
        <h2>⏸ Paused</h2>
        <div class="menu-option" onclick="game.resume()">Continue</div>
        <div class="menu-option" onclick="game.regenerate()">New World</div>
    </div>

    <div id="crosshair"></div>

    <div id="hotbar"></div>

    <div id="info">
        <div>FPS: <span id="fps">0</span></div>
        <div>Blocks: <span id="blockCount">0</span></div>
        <div>Chunks: <span id="chunkCount">0</span></div>
        <div>XYZ: <span id="coords">0, 0, 0</span></div>
    </div>

    <div id="blockInfo"></div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/noise.js"></script>
    <script src="js/world.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
