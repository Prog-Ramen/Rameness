<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniCraft - Browser Minecraft Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui-layer">
    <div id="crosshair"></div>
    <div id="hotbar">
      <!-- 9 hotbar slots generated by JS -->
    </div>
    <div id="info-panel">
      <div id="fps">FPS: 0</div>
      <div id="pos">Pos: 0, 0, 0</div>
      <div id="block-info">Block: Grass</div>
    </div>
    <div id="instructions">
      <div id="title">MiniCraft</div>
      <div id="hint">WASD to move · SPACE to jump · Click to break/place blocks · 1-9 or scroll to select block · ESC for menu</div>
    </div>
  </div>
  <div id="loading">Generating world...</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
