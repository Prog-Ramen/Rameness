<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniCraft (Browser Minecraft Clone)</title>
<style id="inline-style">
/* ---- MiniCraft styles ---- */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
#game-canvas { display: block; width: 100%; height: 100%; outline: none; cursor: none; }
#debug { position: absolute; top: 8px; left: 8px; color: #fff; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px; font-size: 12px; line-height: 1.5; pointer-events: none; white-space: pre; z-index: 5; }
</style>
</head>
<body>
<div id="debug"></div>
<canvas id="game-canvas" tabindex="0"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="game.js"></script>
</body>
</html>
